# civilization.satori.host → satori 宿主 nginx → 远端 dev Gateway NodePort。
# 安装位置：/etc/nginx/sites-available/civilization.satori.host
# 证书：certbot certonly --webroot -w /var/www/letsencrypt -d civilization.satori.host

map $http_upgrade $civilization_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name civilization.satori.host;

    access_log /var/log/nginx/civilization.satori.host.access.log;
    error_log /var/log/nginx/civilization.satori.host.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name civilization.satori.host;

    access_log /var/log/nginx/civilization.satori.host.access.log;
    error_log /var/log/nginx/civilization.satori.host.error.log;

    ssl_certificate /etc/letsencrypt/live/civilization.satori.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/civilization.satori.host/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass https://10.66.66.4:32715;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $civilization_connection_upgrade;
        proxy_set_header Host civilization.dev.platform.internal;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_ssl_server_name on;
        proxy_ssl_name civilization.dev.platform.internal;
        proxy_ssl_verify off;
    }
}
