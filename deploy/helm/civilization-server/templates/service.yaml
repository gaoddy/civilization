apiVersion: v1
kind: Service
metadata:
  name: civilization-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "civilization-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "civilization-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
