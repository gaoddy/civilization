{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civilization-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "civilization-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "civilization-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    # DNS 解析。
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.steamEgress }}
    # Steam Web API 验票。
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
