apiVersion: apps/v1
kind: Deployment
metadata:
  name: civilization-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "civilization-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "civilization-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "civilization-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ROOM_SERVICE_LISTEN
              valueFrom:
                configMapKeyRef:
                  name: civilization-server-config
                  key: listen-addr
            - name: RANKED_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: civilization-server-config
                  key: ranked-config
          envFrom:
            - secretRef:
                name: {{ required "existingSecretName is required" .Values.existingSecretName }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      terminationGracePeriodSeconds: 30
