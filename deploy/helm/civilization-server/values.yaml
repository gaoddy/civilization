replicaCount: 1

image:
  repository: civilization-server
  tag: dev
  pullPolicy: Never

namespace: civilization-dev

# Secret 以 envFrom 注入；Steam 发行环境另需 STEAM_WEB_API_KEY 与 STEAM_APP_ID
# 两个键，缺任一项时服务端降级为 STEAM_DISABLED，手机号登录不受影响。
existingSecretName: civilization-postgres-civilization

networkPolicy:
  # 默认不创建，避免改变现有集群的出网行为。
  enabled: false
  # 放行 Steam Web API（api.steampowered.com:443）；NetworkPolicy 只能按端口放行，
  # 域名限制由集群 DNS / 出网防火墙承担。
  steamEgress: true

config:
  listenAddr: 0.0.0.0:8080
  # 天梯运行参数；注入为 RANKED_CONFIG JSON。段位区间可在上线后调整，
  # 调整后按当前积分实时重算。字段名与 room-service 的 RankedConfig 一致。
  rankedConfig:
    k: 200
    recentOpponentRelaxMs: 60000
    masterRankLimit: 500
    tiers:
      - id: apprentice
        minRating: 0
      - id: bronze
        minRating: 900
      - id: silver
        minRating: 1100
      - id: gold
        minRating: 1250
      - id: platinum
        minRating: 1400
      - id: diamond
        minRating: 1550
      - id: master
        minRating: 1700
      - id: grandmaster
        minRating: 1900

service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

nodeSelector: {}

httpRoute:
  enabled: true
  gatewayName: platform-gateway
  gatewayNamespace: platform-dev
  sectionName: https
  hostnames: []
  pathPrefix: /
