[package]
name = "sim"
version.workspace = true
edition.workspace = true

[lib]
name = "sim"
path = "src/lib.rs"

[[bin]]
name = "sim"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
protocol = { version = "0.1.0", path = "../protocol" }
rule-engine = { path = "../rule-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tokio-tungstenite = "0.29"
