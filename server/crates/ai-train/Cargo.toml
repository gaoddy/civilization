[package]
name = "ai-train"
version.workspace = true
edition.workspace = true

[lib]
name = "ai_train"
path = "src/lib.rs"

[[bin]]
name = "ai-train"
path = "src/main.rs"

[features]
default = []
train = ["dep:candle-core", "dep:candle-nn"]

[dependencies]
ai-core = { path = "../ai-core" }
ai-model = { path = "../ai-model" }
rule-engine = { path = "../rule-engine" }
sim = { path = "../sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
